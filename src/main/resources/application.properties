
# Nome del nuovo progetto nei log
spring.application.name=new-security-demo

# Connessione al database MySQL (assicurati che lo schema 'cakeme' esista su Workbench)
spring.datasource.url=jdbc:mysql://localhost:3306/cakeme?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Forziamo il reset pulito delle tabelle per evitare conflitti di mappatura
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

