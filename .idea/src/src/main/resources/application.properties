
spring.application.name=CakeMe

# Connessione al database MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cakeme?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Manteniamo i dati salvati nel database evitando azzeramenti continui
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ATTIVIAMO IL LOG DI DEBUG PER VEDERE L'ERRORE DI AUTENTICAZIONE IN TEMPO REALE
logging.level.org.springframework.security=DEBUG
spring.jpa.open-in-view=false


